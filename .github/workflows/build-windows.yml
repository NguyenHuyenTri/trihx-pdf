name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Read application version
        id: version
        shell: bash
        run: python -c "from app_update import APP_VERSION; print('version=' + APP_VERSION)" >> "$GITHUB_OUTPUT"
      - name: Test updates on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: pyinstaller --clean --noconfirm PDFReader.spec
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: HX-PDF-Windows-x64
          path: dist/HX PDF.exe
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $path = if ($compiler) { $compiler.Source } else { Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $path)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install Inno Setup' }
          }
          & $path TRIHXOffice.iss
          if ($LASTEXITCODE -ne 0) { throw 'Cannot build installer' }
      - name: Install and open the packaged reader
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'TRIHX PDF installation'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="{0}"' -f $installDir))
          $setup = Start-Process -FilePath '.\dist\TRIHX Office Setup.exe' -ArgumentList $arguments -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup exited with $($setup.ExitCode)" }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TRIHX.Office.Windows_is1'
          if ((Get-ItemProperty $key).DisplayVersion -ne $env:RELEASE_VERSION) { throw 'Installed version mismatch' }
          $exe = Join-Path $installDir "trihx-versions\$env:RELEASE_VERSION\HX PDF.exe"
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'TRIHX PDF\TRIHX PDF.lnk'
          $sample = Join-Path $env:RUNNER_TEMP 'Window startup test.pdf'
          python -c "import sys; from PIL import Image; Image.new('RGB', (120, 160), 'white').save(sys.argv[1])" $sample
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the sample PDF' }
          foreach ($document in @('', $sample)) {
            if ($document) {
              python -c "import sys; from win32com.shell import shell, shellcon; shell.ShellExecuteEx(fMask=shellcon.SEE_MASK_CLASSNAME, lpClass='HXPDF.Document', lpVerb='open', lpFile=sys.argv[1], nShow=1)" $document
              if ($LASTEXITCODE -ne 0) { throw 'Could not open the PDF with the registered reader' }
            } else {
              Start-Process -FilePath $shortcut
            }
            $deadline = (Get-Date).AddSeconds(90)
            do {
              Start-Sleep -Seconds 1
              $window = Get-Process -Name 'HX PDF' -ErrorAction SilentlyContinue |
                Where-Object { $_.Path -eq $exe -and $_.MainWindowTitle -eq 'TRIHX PDF' } | Select-Object -First 1
            } until ($window -or (Get-Date) -gt $deadline)
            if (-not $window) { throw 'The installed reader did not open its main window' }
            try {
              python tests/check_window_placement.py $window.MainWindowHandle $document
              if ($LASTEXITCODE -ne 0) { throw 'Window placement check failed' }
            } finally {
              $null = $window.CloseMainWindow()
              if (-not $window.WaitForExit(15000)) { throw 'The reader did not close' }
            }
          }
      - name: Verify a background upgrade across two packaged reader versions
        shell: pwsh
        run: |
          $next = python -c "from app_update import APP_VERSION,version_key; a,b,c = version_key(APP_VERSION); print(f'{a}.{b}.{c+1}')"
          $payloadDir = Join-Path $env:RUNNER_TEMP 'next-reader'
          $versionFile = (Resolve-Path 'version.ini').Path
          $original = [IO.File]::ReadAllBytes($versionFile)
          try {
            [IO.File]::WriteAllLines($versionFile, @('[app]', "version=$next"), [Text.Encoding]::ASCII)
            pyinstaller --noconfirm --distpath $payloadDir PDFReader.spec
            if ($LASTEXITCODE -ne 0) { throw 'Could not build the next-version test reader' }
          } finally {
            [IO.File]::WriteAllBytes($versionFile, $original)
          }
          $installed = Join-Path $env:RUNNER_TEMP 'TRIHX PDF installation'
          python tests/check_live_update.py $installed (Join-Path $payloadDir 'HX PDF.exe') $next
          if ($LASTEXITCODE -ne 0) { throw 'Background upgrade failed' }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TRIHX-Office-Setup-Windows-x64
          path: dist/TRIHX Office Setup.exe
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: trihx-release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TRIHX-Office-Setup-Windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: HX-PDF-Windows-x64
          path: reader
      - name: Publish the Windows installer and background update together
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          setup=TRIHX-PDF-Setup-Windows-x64.exe
          reader=TRIHX-PDF-Reader-Windows-x64.exe
          repo="$GITHUB_REPOSITORY"
          if existing=$(gh release view "$tag" --repo "$repo" --json isDraft,targetCommitish,databaseId); then
            if [[ $(jq -r .isDraft <<< "$existing") == false ]]; then
              id=$(jq -r .databaseId <<< "$existing")
              gh api "repos/$repo/releases/$id/assets" | jq -e --arg setup "$setup" --arg reader "$reader" \
                '[.[] | select(.state == "uploaded") | .name] | contains([$setup, $reader])'
              exit 0
            fi
            [[ $(jq -r .targetCommitish <<< "$existing") == "$GITHUB_SHA" ]] || { echo "Draft belongs to another commit"; exit 1; }
          else
            gh release create "$tag" --repo "$repo" --target "$GITHUB_SHA" --draft \
              --title "TRIHX PDF $VERSION" --notes "Cài lần đầu bằng tệp Setup. Từ bản 0.3.4, chọn Cài đặt → Cập nhật ngay để tiếp tục dùng PDF trong lúc tải bản mới."
          fi
          mv 'TRIHX Office Setup.exe' "$setup"
          mv 'reader/HX PDF.exe' "$reader"
          gh release upload "$tag" "$setup" "$reader" --clobber --repo "$repo"
          id=$(gh release view "$tag" --repo "$repo" --json databaseId --jq .databaseId)
          assets=$(gh api "repos/$repo/releases/$id/assets")
          for file in "$setup" "$reader"; do
            digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            jq -e --arg name "$file" --arg digest "$digest" 'any(.[]; .name == $name and .digest == $digest and .state == "uploaded")' <<< "$assets"
          done
          gh release edit "$tag" --repo "$repo" --draft=false
